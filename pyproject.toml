[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "A desktop utility for scanning folders, detecting duplicates, and organizing files by category."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Smart File Organizer" }
]
license = { text = "UNLICENSED" }
dependencies = [
  "customtkinter>=2.7.0"
]

[project.scripts]
smart-file-organizer = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.ui"]
